<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groot Dialyse</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 15px; background-color: #f4f7f6; color: #333; }
    h2 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 8px; }
    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .card h3 { margin-top: 0; color: #444; font-size: 1.05em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.85em; color: #555; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
    input[readonly] { background-color: #e9ecef; }
    button { background-color: #1a73e8; color: white; border: none; padding: 14px; font-size: 1em; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
    button:disabled { background-color: #9aa0a6; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>💉 Groot Dialyse Formulier</h2>

  <form id="dialyseForm">
    <div class="card">
      <h3>📅 Algemene Gegevens</h3>
      <div class="grid">
        <div>
          <label for="afspraakDatumTijd">Afspraak Datum/Tijd</label>
          <input type="datetime-local" id="afspraakDatumTijd">
        </div>
        <div>
          <label for="verpleegkundige">Verpleegkundige</label>
          <input type="text" id="verpleegkundige" placeholder="Naam verpleegkundige">
        </div>
        <div>
          <label for="startTijd">Start Datum/Tijd</label>
          <input type="datetime-local" id="startTijd">
        </div>
        <div>
          <label for="eindTijd">Eind Datum/Tijd</label>
          <input type="datetime-local" id="eindTijd">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>⚖️ Gewichten & UF</h3>
      <div class="grid">
        <div>
          <label for="streefGewicht">Streefgewicht (kg)</label>
          <input type="number" step="0.1" id="streefGewicht" value="109.0" placeholder="109.0" oninput="berekenUFAdvies()">
        </div>
        <div>
          <label for="gewichtVoor">Gewicht voor (kg)</label>
          <input type="number" step="0.1" id="gewichtVoor" placeholder="112.5" oninput="berekenUFAdvies()">
        </div>
        <div>
          <label for="gewichtNa">Gewicht na (kg)</label>
          <input type="number" step="0.1" id="gewichtNa">
        </div>
        <div>
          <label for="ufAdvies">UF advies (berekend)</label>
          <input type="number" step="0.1" id="ufAdvies" readonly placeholder="Automatisch">
        </div>
        <div>
          <label for="ufIngevoerd">UF ingevoerd</label>
          <input type="number" step="0.1" id="ufIngevoerd">
        </div>
        <div>
          <label for="ufWerkelijk">UF werkelijk</label>
          <input type="number" step="0.1" id="ufWerkelijk">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>💊 Medicatie</h3>
      <div class="grid">
        <div>
          <label for="fragmin2500">FRAGMIN 2500</label>
          <input type="text" id="fragmin2500">
        </div>
        <div>
          <label for="fragmin5000">FRAGMIN 5000</label>
          <input type="text" id="fragmin5000">
        </div>
        <div>
          <label for="epo">Epo</label>
          <input type="text" id="epo">
        </div>
        <div>
          <label for="ijzer">IJzer</label>
          <input type="text" id="ijzer">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>🩺 Shunt & Opmerkingen</h3>
      <div class="grid">
        <div>
          <label for="prikdag">Prikdag</label>
          <input type="text" id="prikdag">
        </div>
        <div>
          <label for="shuntflow">Shuntflow</label>
          <input type="text" id="shuntflow">
        </div>
        <div>
          <label for="shuntflowUitkomst">Shuntflow uitkomst</label>
          <input type="text" id="shuntflowUitkomst">
        </div>
      </div>
      <div style="margin-top: 10px;">
        <label for="opmerking">Opmerking</label>
        <textarea id="opmerking" rows="3"></textarea>
      </div>
    </div>

    <button type="submit" id="btnSubmit">💾 Opslaan in Google Sheet</button>
  </form>

  <div id="status"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVtVPkS5EVtSjfA55YMouZYh3qb-2fIhCPHepTqu4pr3EIlpKhDQKkPRotbsTnX6ytww/exec";

    function berekenUFAdvies() {
      const voor = parseFloat(document.getElementById('gewichtVoor').value);
      const streef = parseFloat(document.getElementById('streefGewicht').value);
      if (!isNaN(voor) && !isNaN(streef)) {
        document.getElementById('ufAdvies').value = (voor - streef + 0.3).toFixed(2);
      } else {
        document.getElementById('ufAdvies').value = '';
      }
    }

    document.getElementById('dialyseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const status = document.getElementById('status');

      btn.disabled = true;
      btn.innerText = "Bezig met opslaan...";
      status.style.color = "#333";
      status.innerText = "Verzenden naar Google Sheet...";

      const payload = {
        afspraakDatumTijd: document.getElementById('afspraakDatumTijd').value,
        verpleegkundige: document.getElementById('verpleegkundige').value,
        startTijd: document.getElementById('startTijd').value,
        eindTijd: document.getElementById('eindTijd').value,
        streefGewicht: document.getElementById('streefGewicht').value,
        gewichtVoor: document.getElementById('gewichtVoor').value,
        gewichtNa: document.getElementById('gewichtNa').value,
        ufAdvies: document.getElementById('ufAdvies').value,
        ufIngevoerd: document.getElementById('ufIngevoerd').value,
        ufWerkelijk: document.getElementById('ufWerkelijk').value,
        fragmin2500: document.getElementById('fragmin2500').value,
        fragmin5000: document.getElementById('fragmin5000').value,
        epo: document.getElementById('epo').value,
        ijzer: document.getElementById('ijzer').value,
        prikdag: document.getElementById('prikdag').value,
        shuntflow: document.getElementById('shuntflow').value,
        shuntflowUitkomst: document.getElementById('shuntflowUitkomst').value,
        opmerking: document.getElementById('opmerking').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        status.style.color = "#2e7d32";
        status.innerText = "Gegevens succesvol verzonden!";
        document.getElementById('dialyseForm').reset();
        document.getElementById('streefGewicht').value = "109.0";
      })
      .catch(err => {
        status.style.color = "#c62828";
        status.innerText = "Fout bij verzenden: " + err;
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "💾 Opslaan in Google Sheet";
      });
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Actief'))
        .catch(err => console.log('SW Fout:', err));
    }
  </script>
</body>
</html>
